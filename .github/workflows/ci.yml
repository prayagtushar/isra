name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/retrieval
          - apps/api
          - apps/ingest
          - apps/evals

    services:
      # Real pgvector instance so the retrieval integration tests actually run
      # instead of silently skipping the way they do on a machine without Docker.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: isra
          POSTGRES_PASSWORD: isra
          POSTGRES_DB: isra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isra"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://isra:isra@localhost:5432/isra
      # The integration tests bind to this and deliberately ignore DATABASE_URL
      # so they can never write to a deployed database. See packages/retrieval/tests/dsn.py.
      ISRA_TEST_DATABASE_URL: postgresql://isra:isra@localhost:5432/isra

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Load database schema
        run: psql "$ISRA_TEST_DATABASE_URL" -f packages/retrieval/src/isra_retrieval/schema.sql

      # The BGE embedder and cross-encoder are pulled from HuggingFace on first
      # use. Cache them so every run does not re-download ~150 MB of weights.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-en-v1.5

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Run tests
        run: uv run --directory ${{ matrix.package }} pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run --filter web lint

      - name: Test
        run: bun run --filter web test

      - name: Build
        env:
          # The web build fails loudly without this in production mode; supply a
          # throwaway value so CI exercises the same code path as a real build.
          API_URL: http://localhost:8000
        run: bun run --filter web build
